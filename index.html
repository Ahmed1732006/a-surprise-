<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رسالة خاصة 🤐</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ───────── ROOT ───────── */
        :root {
            --glow-white: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.4);
            --glow-gold: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 140, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            transition: background 3s ease;
        }

        /* ───────── BACKGROUND ───────── */
        #bg-gradient {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            opacity: 1;
            transition: opacity 2s ease, background 3s ease;
        }
        #bg-gradient.celebration {
            background: linear-gradient(135deg, #1a0b2e 0%, #4a154b 50%, #192b4d 100%);
            animation: breathe 8s infinite alternate ease-in-out;
        }
        @keyframes breathe {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }
            100% {
                transform: scale(1.05);
                filter: brightness(1.2);
            }
        }

        /* ───────── CANVAS ───────── */
        canvas {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ───────── UI LAYER ───────── */
        #ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            perspective: 1000px;
        }

        /* ───────── TEXT ───────── */
        .message-text {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            text-shadow: var(--glow-white);
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.5s ease, transform 0.5s ease;
            white-space: pre-wrap;
            position: relative;
        }
        .cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .shake {
            animation: nervous 0.15s infinite;
        }
        @keyframes nervous {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }
            25% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }
            50% {
                transform: translate(-3px, 0px) rotate(1deg);
            }
            75% {
                transform: translate(2px, 2px) rotate(0deg);
            }
            100% {
                transform: translate(1px, -1px) rotate(0deg);
            }
        }

        .tense-mode {
            animation: heartbeat 1.5s infinite cubic-bezier(0.215, 0.610, 0.355, 1.000);
        }
        @keyframes heartbeat {
            0% {
                transform: scale(1);
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
            15% {
                transform: scale(1.05);
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            }
            30% {
                transform: scale(1);
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
            45% {
                transform: scale(1.05);
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            }
            100% {
                transform: scale(1);
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
        }

        .fade-in {
            animation: fadeInBlur 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes fadeInBlur {
            0% {
                opacity: 0;
                filter: blur(10px);
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1);
            }
        }

        .gold-text {
            color: #fff8e7;
            text-shadow: var(--glow-gold);
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
        }

        .bounce-in {
            animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .pulse-gentle {
            animation: pulseGentle 2s infinite ease-in-out;
        }
        @keyframes pulseGentle {
            0%,
            100% {
                transform: scale(1);
                text-shadow: var(--glow-gold);
            }
            50% {
                transform: scale(1.03);
                text-shadow: 0 0 30px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 140, 0, 0.8);
            }
        }

        .camera-shake {
            animation: camShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        @keyframes camShake {
            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }
            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translate3d(-5px, 5px, 0);
            }
            20%,
            40%,
            60%,
            80% {
                transform: translate3d(5px, -5px, 0);
            }
        }

        /* ───────── FLASH ───────── */
        .flash-bang {
            position: absolute;
            inset: 0;
            z-index: 999;
            background: #fff;
            opacity: 0;
            pointer-events: none;
        }
        .do-flash {
            animation: flashAnim 0.8s ease-out;
        }
        @keyframes flashAnim {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        /* ───────── START SCREEN ───────── */
        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background:
                radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 35%),
                linear-gradient(135deg, #050505, #000000);
            backdrop-filter: blur(8px);
        }

        .start-btn {
            position: relative;
            padding: 18px 44px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
            color: #fff;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 3px;
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.15),
                0 0 45px rgba(255, 105, 180, 0.12),
                inset 0 0 15px rgba(255, 255, 255, 0.08);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.65);
            transition: all 0.3s ease;
            animation: startGlow 2s infinite ease-in-out;
            overflow: hidden;
        }
        .start-btn::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 105, 180, 0.25), rgba(0, 255, 255, 0.18));
            filter: blur(14px);
            opacity: 0.8;
            z-index: -1;
        }
        .start-btn::after {
            content: "";
            position: absolute;
            top: -40%;
            left: -60%;
            width: 40%;
            height: 180%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            transform: rotate(20deg);
            animation: shineMove 2.5s infinite;
        }
        .start-btn:hover {
            transform: scale(1.08);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.25),
                0 0 70px rgba(255, 105, 180, 0.3);
        }

        @keyframes startGlow {
            0%,
            100% {
                transform: scale(1);
                box-shadow:
                    0 0 20px rgba(255, 255, 255, 0.15),
                    0 0 45px rgba(255, 105, 180, 0.12),
                    inset 0 0 15px rgba(255, 255, 255, 0.08);
            }
            50% {
                transform: scale(1.06);
                box-shadow:
                    0 0 28px rgba(255, 255, 255, 0.25),
                    0 0 60px rgba(255, 105, 180, 0.25),
                    inset 0 0 18px rgba(255, 255, 255, 0.12);
            }
        }
        @keyframes shineMove {
            0% {
                left: -60%;
            }
            100% {
                left: 140%;
            }
        }

        /* ───────── ENDING ───────── */
        .ending-container {
            position: absolute;
            left: 50%;
            bottom: 60px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        .signature {
            min-width: 300px;
            padding: 16px 30px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.08),
                0 0 50px rgba(255, 105, 180, 0.12);
            transition: 0.35s;
        }
        .signature:hover {
            transform: translateY(-4px) scale(1.04);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.18),
                0 0 70px rgba(255, 105, 180, 0.25);
        }

        .restart-btn {
            position: relative;
            min-width: 300px;
            padding: 18px 35px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff4da6, #ff77c8);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(255, 77, 166, 0.45),
                0 0 80px rgba(255, 77, 166, 0.25);
            transition: 0.35s;
        }
        .restart-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 0 45px rgba(255, 77, 166, 0.8),
                0 0 100px rgba(255, 77, 166, 0.5);
        }
        .restart-btn::before {
            content: "";
            position: absolute;
            top: -40%;
            left: -70%;
            width: 40%;
            height: 180%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            transform: rotate(20deg);
            animation: restartShine 2.5s linear infinite;
        }
        .restart-btn:active {
            transform: scale(0.96);
        }
        @keyframes restartShine {
            0% {
                left: -70%;
            }
            100% {
                left: 150%;
            }
        }
    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div id="start-screen" onclick="startExperience()">
        <div class="start-btn">انقر للبدء</div>
    </div>

    <!-- BACKGROUND -->
    <div id="bg-gradient"></div>

    <!-- CANVAS -->
    <canvas id="particleCanvas"></canvas>

    <!-- FLASH -->
    <div class="flash-bang" id="flash"></div>

    <!-- UI -->
    <div id="ui-layer">
        <div id="text-container" class="message-text"></div>
        <div id="ending-layer" class="ending-container">
            <div class="signature">✨ يارب تكون عجبك ✨</div>
            <div class="signature">💖 Designed by A.M</div>
            <button class="restart-btn" onclick="resetExperience()">إعادة التجربة 🙃</button>
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════════════════════════════
           AUDIO
           ═══════════════════════════════════════════════════════════════ */

        const music1 = new Audio("1.mp3");
 
        music1.loop = true;

        music1.volume = 0.5;


        /* ═══════════════════════════════════════════════════════════════
           CANVAS & PHYSICS
           ═══════════════════════════════════════════════════════════════ */

        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;
        let particles = [];
        let fireworks = [];
        let ambientParticles = [];
        let state = 'intro';

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const rand = (min, max) => Math.random() * (max - min) + min;
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        /* ─── Particle ─── */
        class Particle {
            constructor(x, y, color, isSmoke = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.isSmoke = isSmoke;
                const angle = rand(0, Math.PI * 2);
                const speed = isSmoke ? rand(0.5, 2) : rand(2, 15);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = isSmoke ? rand(0.01, 0.03) : rand(0.015, 0.04);
                this.size = isSmoke ? rand(3, 8) : rand(1, 3);
                this.friction = 0.92;
                this.gravity = isSmoke ? -0.05 : 0.1;
            }
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                if (this.isSmoke) this.size += 0.2;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        /* ─── Firework ─── */
        class Firework {
            constructor() {
                this.x = rand(width * 0.1, width * 0.9);
                this.y = height;
                this.targetY = rand(height * 0.1, height * 0.4);
                this.vy = rand(-15, -20);
                this.vx = rand(-2, 2);
                this.color = `hsl(${rand(0, 360)}, 100%, 60%)`;
                this.trail = [];
                this.exploded = false;
            }
            update() {
                if (this.exploded) return;
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 10) this.trail.shift();
                this.vy += 0.2;
                this.x += this.vx;
                this.y += this.vy;
                if (this.vy >= 0 || this.y <= this.targetY) {
                    this.exploded = true;
                    this.explode();
                }
            }
            explode() {
                for (let i = 0; i < 80; i++) {
                    particles.push(new ConfettiParticle(this.x, this.y, this.color, true));
                }
            }
            draw() {
                if (this.exploded) return;
                ctx.globalAlpha = 1;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                if (this.trail.length > 0) {
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
                } else {
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y + 10);
                }
                ctx.stroke();
            }
        }

        /* ─── ConfettiParticle ─── */
        class ConfettiParticle extends Particle {
            constructor(x, y, color, isExplosion = false) {
                super(x, y, color);
                this.gravity = rand(0.05, 0.15);
                this.decay = rand(0.005, 0.015);
                if (isExplosion) {
                    const angle = rand(0, Math.PI * 2);
                    const speed = rand(2, 12);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                } else {
                    this.vx = rand(-2, 2);
                    this.vy = rand(1, 5);
                }
            }
        }

        /* ─── Ambient ─── */
        class Ambient {
            constructor() {
                this.x = rand(0, width);
                this.y = rand(0, height);
                this.vx = rand(-0.2, 0.2);
                this.vy = rand(-0.5, -0.1);
                this.size = rand(0.5, 2);
                this.alpha = rand(0.1, 0.5);
                this.color = '255, 255, 255';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y < 0) {
                    this.y = height;
                    this.x = rand(0, width);
                }
                if (state === 'celebration') {
                    this.color = '255, 215, 0';
                    this.vy = rand(-1, -0.5);
                }
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) ambientParticles.push(new Ambient());

        function spawnExplosion(rect) {
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle(
                    cx + rand(-rect.width / 2, rect.width / 2),
                    cy + rand(-rect.height / 2, rect.height / 2),
                    '#ffffff'
                ));
            }
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(
                    cx + rand(-rect.width / 3, rect.width / 3),
                    cy + rand(-rect.height / 3, rect.height / 3),
                    'rgba(100, 100, 100, 0.5)',
                    true
                ));
            }
        }

        /* ─── Main Loop ─── */
        function loop() {
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ambientParticles.forEach(p => { p.update();
                p.draw(); });

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            if (state === 'celebration') {
                if (Math.random() < 0.05) fireworks.push(new Firework());
                if (Math.random() < 0.2) particles.push(new ConfettiParticle(rand(0, width), -10, `hsl(${rand(0, 360)}, 100%, 60%)`));
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].exploded) fireworks.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }


        /* ═══════════════════════════════════════════════════════════════
           STORY SEQUENCE
           ═══════════════════════════════════════════════════════════════ */

        const textEl = document.getElementById('text-container');
        const bgLayer = document.getElementById('bg-gradient');
        const flashEl = document.getElementById('flash');
        const endingLayer = document.getElementById('ending-layer');

        async function typeText(text, addCursor = true, speed = 80) {
            textEl.innerHTML = '';
            if (addCursor) textEl.classList.add('cursor');
            textEl.style.display = 'block';
            textEl.style.opacity = 1;
            for (let i = 0; i < text.length; i++) {
                textEl.innerHTML = text.substring(0, i + 1);
                await sleep(speed);
            }
        }

        async function nervousExplode() {
            textEl.classList.remove('cursor');
            textEl.classList.add('shake');
            await sleep(800);
            const rect = textEl.getBoundingClientRect();
            textEl.classList.remove('shake');
            textEl.style.opacity = 0;
            spawnExplosion(rect);
            await sleep(100);
            textEl.innerHTML = '';
        }


        /* ─── startExperience ─── */

        async function startExperience() {

            document.getElementById('start-screen').style.display = 'none';

            music1.play();

            loop();

            await sleep(1500);

            // Message 1
            await typeText("انا عاوز اقولك حاجة يا مي 🌝");
            await sleep(2000);
            await nervousExplode();
            await sleep(1500);

            // Message 2
            await typeText("بس مش عاوزك تزعلي مني 🌚");
            await sleep(2000);
            await nervousExplode();
            await sleep(1500);

            // Message 3
            await typeText(" بصي بصراحة كده يا ميوية 👈🏻👉🏻");
            await sleep(2000);
            await nervousExplode();
            await sleep(1500);

            // Message 4
            await typeText(" انا 👈🏻👉🏻 ");
            await sleep(2500);
            await nervousExplode();
            await sleep(1000);

            // Message 5
            await typeText(" انا 👈🏻👉🏻 ");
            await sleep(800);
            textEl.innerHTML = "انا 👈🏻👉🏻.";
            await sleep(800);
            textEl.innerHTML = "انا 👈🏻👉🏻..";
            await sleep(800);
            textEl.innerHTML = "انا 👈🏻👉🏻...";
            await sleep(1200);
            await nervousExplode();
            await sleep(1500);

            // Message 6
            await typeText("  عاوز اعرفك 👈🏻👉🏻 ", false, 120);
            textEl.classList.add('tense-mode');
            bgLayer.style.background = "radial-gradient(circle at center, #0a0a0a 0%, #000 100%)";
            await sleep(3500);
            textEl.classList.remove('tense-mode');
            textEl.style.opacity = 0;
            await sleep(1500);

            // Surprise Buildup
            bgLayer.classList.add('celebration');
            state = 'tense';
            await sleep(2000);

            // Message 7
            textEl.innerHTML = " ان النتيجة طلعت 😊 ";
            textEl.className = "message-text fade-in";
            await sleep(2500);
            spawnExplosion(textEl.getBoundingClientRect());
            textEl.style.opacity = 0;
            await sleep(1000);

            textEl.innerHTML = " ان النتيجة طلعت 😊 ";
            textEl.className = "message-text fade-in";
            await sleep(2000);
            spawnExplosion(textEl.getBoundingClientRect());
            textEl.style.opacity = 0;
            await sleep(800);

            // BIG REVEAL
            flashEl.classList.add('do-flash');
            document.body.classList.add('camera-shake');
            state = 'celebration';

            setTimeout(() => {
                flashEl.classList.remove('do-flash');
                document.body.classList.remove('camera-shake');
            }, 800);

            // ─── Message 8 ───

            textEl.innerHTML = "  وانك نجحتي 🎉";
            textEl.className = "message-text gold-text bounce-in";
            await sleep(3000);
            textEl.style.opacity = 0;
            await sleep(500);

            // Message 9 - Counter
            textEl.className = "message-text gold-text";
            textEl.style.opacity = 1;
            const steps = [0, 8, 12, 19, 30, 37, 58, 66, 71, 80];
            for (let i = 0; i < steps.length; i++) {
                textEl.innerHTML = `جيبتي 😎☝🏻😃 <br>${steps[i]}%`;
                if (steps[i] === 82) {
                    textEl.classList.add('pulse-gentle');
                    document.body.classList.add('camera-shake');
                    setTimeout(() => document.body.classList.remove('camera-shake'), 500);
                }
                await sleep(150 + (i * 100));
            }

            await sleep(3500);
            textEl.style.opacity = 0;
            textEl.classList.remove('pulse-gentle');
            await sleep(500);

            // Message 10
            textEl.innerHTML = "  الف مبروك يا ميوش تخطيتي جده عبده بنجاح ❤️😂";
            textEl.className = "message-text gold-text bounce-in";
            await sleep(3000);
            textEl.style.opacity = 0;
            await sleep(500);

            // Message 11
            textEl.innerHTML = "  👆 You are now at level 3 ";
            textEl.className = "message-text gold-text bounce-in";
            await sleep(3000);
            textEl.style.opacity = 0;
            await sleep(500);

            // Final
            textEl.className = "message-text gold-text bounce-in pulse-gentle";
            await sleep(4000);

            endingLayer.style.opacity = 1;
            endingLayer.style.visibility = "visible";
            endingLayer.style.pointerEvents = "auto";
        }


        /* ─── resetExperience ─── */

        function resetExperience() {

            music1.pause();
music1.currentTime = 0;

            state = 'intro';
            particles = [];
            fireworks = [];
            endingLayer.style.opacity = 0;
            endingLayer.style.visibility = "hidden";
            endingLayer.style.pointerEvents = "none";
            textEl.style.opacity = 0;
            textEl.className = "message-text";
            textEl.innerHTML = "";
            bgLayer.classList.remove('celebration');
            bgLayer.style.background = "radial-gradient(circle at center, #111 0%, #000 100%)";

            setTimeout(() => {
                startExperience();
            }, 1000);
        }
    </script>
